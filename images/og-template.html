<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>AJCODER social thumbnail template</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: #09090b;
        color: #f4f4f5;
        font-family: Inter, Arial, sans-serif;
        text-align: center;
      }
      main { width: 1080px; padding: 50px; }
      h1 { margin: 0; font-size: 66px; line-height: 1.12; letter-spacing: -3px; }
      .brand { margin: 28px 0 0; color: #6ee7b7; font-size: 36px; font-weight: 700; letter-spacing: 8px; }
      .subtitle { margin: 22px 0 0; color: #d4d4d8; font-size: 26px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Art Javar Pregoner</h1>
      <p class="brand">AJCODER</p>
      <p class="subtitle">Desktop Support Engineer · Personal web projects in my free time</p>
    </main>
  </body>
</html>
